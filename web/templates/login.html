{% extends "base.html" %}
{% block title %}Вход — Дневник питания{% endblock %}

{% block content %}
<div class="card" style="max-width: 380px; margin: 40px auto;">
    <h2>Вход</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <p>
            <label for="login">Логин (@username из Telegram)</label><br>
            <input id="login" name="login" type="text" autocomplete="username"
                   placeholder="@vasya" required autofocus>
        </p>
        <p>
            <label for="password">Пароль</label><br>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </p>
        <p><button type="submit" class="primary">Войти</button></p>
    </form>
    <p class="muted">
        Аккаунты создаются из терминала:<br>
        <code>python -m nutrition_bot.accounts add @username</code>
    </p>
</div>
{% endblock %}
